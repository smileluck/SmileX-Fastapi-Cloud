[loggers]
keys=root

[handlers]
keys=consoleHandler,devFileHandler

[formatters]
keys=devFormatter

[filters]
keys=requestIdFilter

[logger_root]
level=DEBUG
handlers=consoleHandler,devFileHandler
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=DEBUG
formatter=devFormatter
args=(sys.stdout,)
filters=requestIdFilter

[handler_devFileHandler]
class=core.log.daily_dir_handler.DailyDirFileHandler
level=DEBUG
formatter=devFormatter
args=('%(log_dir)s/app.log','D',1,14,'utf-8',False,False)
filters=requestIdFilter

[filter_requestIdFilter]
class=core.log.request_id_filter.RequestIdFilter

[formatter_devFormatter]
class=core.log.request_id_filter.RequestIdFormatter
format=%(asctime)s %(levelname)-8s [%(name)s:%(module)s:%(lineno)d] [PID:%(process)d] [RID:%(request_id)s] %(message)s
datefmt=%Y-%m-%d %H:%M:%S
