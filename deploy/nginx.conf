# SmileX Cloud Backend - Nginx 反向代理配置参考
# 使用方式:
#   1. 复制到 /etc/nginx/sites-available/smilex-cloud
#   2. ln -s /etc/nginx/sites-available/smilex-cloud /etc/nginx/sites-enabled/
#   3. nginx -t && systemctl reload nginx

upstream smilex_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;  # 替换为你的域名

    # 重定向到 HTTPS（生产环境建议启用）
    # return 301 https://$host$request_uri;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 请求体大小限制（与后端 UPLOAD_LOCAL__MAX_FILE_SIZE 对应）
    client_max_body_size 50m;

    # API 反向代理
    location / {
        proxy_pass http://smilex_backend;
        proxy_http_version 1.1;

        # WebSocket 支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # 缓冲
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # 静态上传文件（可选，由 Nginx 直接服务）
    location /uploads/ {
        alias /opt/smilex-cloud/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 健康检查探针（不记录访问日志，供 SLB/K8s/nginx 自身探测）
    # 修复：原 proxy_pass 指向 /openapi.json，生产环境（openapi_url=None）会恒 404，
    # 导致外部负载均衡器误摘除流量。改为代理到后端真实探针。
    # 存活探针（liveness）：仅判断进程存活，轻量，固定 200
    location /health {
        proxy_pass http://smilex_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # 就绪探针（readiness）：检查 DB + Redis，任一失败返回 503
    # 部署/SLB 判断「是否接入流量」应探此路径（与 deploy.env HEALTH_CHECK_URL 语义一致）
    location /ready {
        proxy_pass http://smilex_backend/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # 访问日志
    access_log /var/log/nginx/smilex_cloud_access.log;
    error_log /var/log/nginx/smilex_cloud_error.log;
}

